<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Amaculis — Desk</title>
    <meta name="description" content="Interactive CV: a photorealistic desk with a laptop and project files by Amaculis." />
    <meta name="theme-color" content="#14110f" />
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>💻</text></svg>" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Caveat:wght@600&family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500&family=Source+Serif+4:ital,wght@0,400;1,400&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <canvas id="scene" aria-label="3D desk with a laptop and project documents"></canvas>

    <div id="loader" role="status">
      <div class="loader-inner">
        <p class="loader-name">Amaculis</p>
        <p class="loader-sub">Setting up the desk…</p>
        <div class="bar"><i></i></div>
      </div>
    </div>

    <div class="letterbox top" aria-hidden="true"></div>
    <div class="letterbox bottom" aria-hidden="true"></div>
    <div id="title" aria-hidden="true">
      <p class="t-name">Amaculis</p>
      <p class="t-role">Software Engineer · Cybersecurity</p>
    </div>

    <div id="tooltip" aria-hidden="true"></div>

    <div id="hint">
      <span>Click the <b>laptop</b> to open it</span><span class="sep">·</span><span>Pick up a <b>document</b> to read about a project</span>
    </div>

    <!-- Paper sheet with project details -->
    <div id="panel" role="dialog" aria-modal="true" aria-label="Project details">
      <article class="sheet">
        <button class="sheet-close" aria-label="Put it back">✕</button>
        <div class="sheet-body"></div>
      </article>
    </div>

    <!-- Laptop OS, positioned over the 3D display -->
    <div id="os" aria-label="Portfolio OS">
      <div class="os-screen">
        <div class="os-menubar">
          <span class="os-logo">●</span><b>Amaculis</b><button class="os-menu" data-open="terminal">Terminal</button><button class="os-menu" data-open="about">About</button>
          <span class="spacer"></span><span class="os-clock"></span>
          <button class="os-exit" title="Back to desk (Esc)">⏏ Back to desk</button>
        </div>
        <div class="os-desktop">
          <nav class="os-icons" aria-label="Projects"></nav>
        </div>
      </div>
    </div>

    <noscript>This CV is an interactive 3D page and needs JavaScript. Projects: https://github.com/Amaculis</noscript>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
